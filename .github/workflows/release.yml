name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Require the tagged commit to belong to main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in origin/main."
          }
      - run: npm ci
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Verify tag and package versions
        shell: pwsh
        run: npm run version:check -- --tag "${{ github.ref_name }}"
      - run: npm run licenses:check
      - run: npm test
      - run: npm run lint
      - name: Require Windows signing configuration
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_SUBJECT: ${{ vars.WIN_CSC_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "WIN_CSC_LINK is required for a production release."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "WIN_CSC_KEY_PASSWORD is required for a production release."
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_SUBJECT)) {
            throw "WIN_CSC_SUBJECT repository variable is required for a production release."
          }
      - run: npm run release:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: npm run sbom:generate
      - run: npm run release:evidence
      - name: Verify signed Windows artifacts
        shell: pwsh
        env:
          WIN_CSC_SUBJECT: ${{ vars.WIN_CSC_SUBJECT }}
        run: ./scripts/verify-windows-artifacts.ps1 -RequireSignature -ExpectedSignerSubject $env:WIN_CSC_SUBJECT
      - name: Run packaged Windows smoke tests
        run: npm run desktop:smoke:packaged
      - name: Download previous public installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-previous-installer.ps1 -Repository "${{ github.repository }}" -AllowMissing
      - name: Verify signed install, optional upgrade, and uninstall
        shell: pwsh
        env:
          WIN_CSC_SUBJECT: ${{ vars.WIN_CSC_SUBJECT }}
        run: ./scripts/install-smoke.ps1 -PreviousInstaller "${{ steps.previous.outputs.path }}" -RequireSignature -ExpectedSignerSubject $env:WIN_CSC_SUBJECT
      - name: Attest release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS.txt
            artifacts/release-assets.json
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $manifest = Get-Content artifacts/release-assets.json -Raw | ConvertFrom-Json
          $artifactNames = @($manifest.publishFiles | ForEach-Object { [string]$_ })
          if ($manifest.version -ne $tag.TrimStart("v") -or $artifactNames.Count -ne 7) {
            throw "Release asset manifest does not match the release tag or canonical file count."
          }
          $artifacts = foreach ($name in $artifactNames) {
            $path = Join-Path artifacts $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required publish asset is missing: $name"
            }
            Get-Item -LiteralPath $path
          }
          if (gh release view $tag 2>$null) {
            throw "Release $tag already exists; refusing to overwrite immutable release assets."
          }
          gh release create $tag $artifacts.FullName --verify-tag --generate-notes --title "Codex Gesture Dock $tag"
