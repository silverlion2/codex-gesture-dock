name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        shell: pwsh
        run: npm run version:check -- --tag "${{ github.ref_name }}"
      - run: npm test
      - run: npm run lint
      - run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem artifacts -File | Where-Object {
            $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml'
          }
          if (-not ($artifacts.Name -match '-setup\.exe$')) { throw "NSIS installer was not generated." }
          if (-not ($artifacts.Name -match '-portable\.exe$')) { throw "Portable executable was not generated." }
          if (-not ($artifacts.Name -contains 'latest.yml')) { throw "Updater metadata was not generated." }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $artifacts = Get-ChildItem artifacts -File | Where-Object {
            $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' -or $_.Name -eq 'SHA256SUMS.txt'
          }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $artifacts.FullName --clobber
          } else {
            gh release create $tag $artifacts.FullName --verify-tag --generate-notes --title "Codex Gesture Dock $tag"
          }
