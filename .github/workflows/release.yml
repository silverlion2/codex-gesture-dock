name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        shell: pwsh
        run: npm run version:check -- --tag "${{ github.ref_name }}"
      - run: npm test
      - run: npm run lint
      - run: npm run dist:win
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem artifacts -Filter "Codex-Gesture-Dock-*-portable.exe" | Select-Object -First 1
          if (-not $artifact) { throw "Portable executable was not generated." }
          $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $artifact = Get-ChildItem artifacts -Filter "Codex-Gesture-Dock-*-portable.exe" | Select-Object -First 1
          if (gh release view $tag 2>$null) {
            gh release upload $tag $artifact.FullName artifacts/SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $artifact.FullName artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "Codex Gesture Dock $tag"
          }
